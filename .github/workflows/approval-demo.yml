name: Demo - Release & Commit Info Test
run-name: Demo run from ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:

env:
  DEPLOYMENT_ON: DEMO

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Build + Send Started Email
  # ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.capture.outputs.build_time }}
      build_time_epoch: ${{ steps.capture.outputs.build_time_epoch }}
      release_name: ${{ steps.release_info.outputs.release_name }}
      release_tag: ${{ steps.release_info.outputs.release_tag }}
      commit_message: ${{ steps.commit_msg.outputs.commit_message }}
    steps:

      - name: Capture Build Time
        id: capture
        run: |
          TIME=$(date '+%d-%b-%Y %I:%M:%S %p UTC')
          EPOCH=$(date +%s)
          echo "build_time=$TIME" >> $GITHUB_OUTPUT
          echo "build_time_epoch=$EPOCH" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$TIME" >> $GITHUB_ENV

      # ── Fetch actual commit message via API ──
      - name: Get Commit Message
        id: commit_msg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MSG=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}" \
            | jq -r '.commit.message // "Manual Workflow Trigger"')

          # Fallback if empty or null
          if [ -z "$MSG" ] || [ "$MSG" = "null" ]; then
            MSG="Manual Workflow Trigger"
          fi

          # First line only
          MSG_FIRST_LINE=$(echo "$MSG" | head -n 1)

          echo "commit_message=${MSG_FIRST_LINE}" >> $GITHUB_OUTPUT
          echo "COMMIT_MESSAGE=${MSG_FIRST_LINE}" >> $GITHUB_ENV
          echo "Commit Message: ${MSG_FIRST_LINE}"

      # ── Fetch latest GitHub Release name + tag ──
      - name: Get Latest Release Info
        id: release_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_DATA=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")

          RELEASE_NAME=$(echo "$RELEASE_DATA" | jq -r '.name // "N/A"')
          RELEASE_TAG=$(echo "$RELEASE_DATA" | jq -r '.tag_name // "N/A"')

          if [ -z "$RELEASE_NAME" ] || [ "$RELEASE_NAME" = "null" ]; then
            RELEASE_NAME="N/A"
          fi
          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "null" ]; then
            RELEASE_TAG="N/A"
          fi

          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "Latest Release: ${RELEASE_NAME} (${RELEASE_TAG})"

      - name: Fake Build
        run: |
          echo "Building application..."
          sleep 5
          echo "Build completed"

      - name: Send Deployment Started Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          secure: false
          subject: "🚀 Deployment Started - ${{ env.DEPLOYMENT_ON }}"
          from: "GitHub Actions <${{ secrets.EMAIL_USERNAME }}>"
          to: hsolanki81815@gmail.com,gulabo81815@gmail.com
          html_body: |
            <h2>🚀 Deployment Started</h2>
            <p>A deployment workflow has been initiated.</p>
            <table border="1" cellpadding="5" cellspacing="0">
              <tr><td><b>Environment</b></td><td>${{ env.DEPLOYMENT_ON }}</td></tr>
              <tr><td><b>Workflow</b></td><td>${{ github.workflow }}</td></tr>
              <tr><td><b>Triggered By</b></td><td>${{ github.actor }}</td></tr>
              <tr><td><b>Branch</b></td><td>${{ github.ref_name }}</td></tr>
              <tr><td><b>Commit ID</b></td><td>${{ github.sha }}</td></tr>
              <tr><td><b>Commit Message</b></td><td>${{ env.COMMIT_MESSAGE }}</td></tr>
              <tr><td><b>Release Name</b></td><td>${{ env.RELEASE_NAME }}</td></tr>
              <tr><td><b>Release Tag</b></td><td>${{ env.RELEASE_TAG }}</td></tr>
              <tr><td><b>Start Time</b></td><td>${{ env.BUILD_TIME }}</td></tr>
            </table>
            <br>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow</a>
            <p>The deployment is currently in progress.</p>

  # ─────────────────────────────────────────────
  # JOB 2: Deploy + Send Completion Email
  # ─────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:

      - name: Fake Deployment
        run: |
          echo "🚀 Deploying application..."
          sleep 5
          echo "✅ Deployment completed successfully"

      - name: Capture End Time & Duration
        if: always()
        run: |
          END_EPOCH=$(date +%s)
          START_EPOCH=${{ needs.build.outputs.build_time_epoch }}
          DURATION=$((END_EPOCH - START_EPOCH))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          echo "DEPLOY_END=$(date '+%d-%b-%Y %I:%M:%S %p UTC')" >> $GITHUB_ENV
          echo "DEPLOY_START=${{ needs.build.outputs.build_time }}" >> $GITHUB_ENV
          echo "DEPLOY_DURATION=${MINUTES}m ${SECONDS}s" >> $GITHUB_ENV

      - name: Send Completion Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          secure: false
          subject: "${{ job.status == 'success' && '✅' || '❌' }} Deployment ${{ job.status == 'success' && 'Successful' || 'Failed' }} - ${{ env.DEPLOYMENT_ON }}"
          from: "GitHub Actions <${{ secrets.EMAIL_USERNAME }}>"
          to: hsolanki81815@gmail.com,gulabo81815@gmail.com
          html_body: |
            <h2>${{ job.status == 'success' && '✅ Deployment Successful' || '❌ Deployment Failed' }}</h2>
            <p>The deployment workflow has completed ${{ job.status == 'success' && 'successfully' || 'with failures' }}.</p>
            <table border="1" cellpadding="5" cellspacing="0">
              <tr><td><b>Environment</b></td><td>${{ env.DEPLOYMENT_ON }}</td></tr>
              <tr><td><b>Triggered By</b></td><td>${{ github.actor }}</td></tr>
              <tr><td><b>Branch</b></td><td>${{ github.ref_name }}</td></tr>
              <tr><td><b>Commit ID</b></td><td>${{ github.sha }}</td></tr>
              <tr><td><b>Commit Message</b></td><td>${{ needs.build.outputs.commit_message }}</td></tr>
              <tr><td><b>Release Name</b></td><td>${{ needs.build.outputs.release_name }}</td></tr>
              <tr><td><b>Release Tag</b></td><td>${{ needs.build.outputs.release_tag }}</td></tr>
              <tr><td><b>Start Time</b></td><td>${{ env.DEPLOY_START }}</td></tr>
              <tr><td><b>End Time</b></td><td>${{ env.DEPLOY_END }}</td></tr>
              <tr><td><b>Total Duration</b></td><td>${{ env.DEPLOY_DURATION }}</td></tr>
            </table>
            <br>
            <p>${{ job.status == 'success' && '✅ SUCCESS — Please proceed with validation.' || '❌ FAILED — Check the workflow logs.' }}</p>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow</a>
